{{- $type := .Get 0 | default "note" -}}
{{- $title := .Get 1 | default (printf "callouts.%s" $type | i18n) | default ($type | strings.FirstUpper) -}}
<div class="callout callout-{{ $type }}" role="note"><div class="callout-title">{{ $title }}</div><div class="callout-content">{{ replaceRE "(?m)^ {1,4}" "" .Inner | markdownify | emojify }}</div></div>
